<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Curio Attendance · QR sheet</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 24px; background: #f8fafc; color: #0f172a; }
  .no-print { max-width: 900px; margin: 0 auto 20px; text-align: center; }
  .no-print h1 { margin: 0 0 6px; }
  .no-print p { color: #64748b; margin: 0 0 12px; }
  .no-print button { padding: 10px 20px; background: #1F4E78; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; max-width: 900px; margin: 0 auto; }
  .qr-card {
    background: white; border: 2px solid #e5e7eb; border-radius: 12px;
    padding: 16px 12px 14px; text-align: center; page-break-inside: avoid;
  }
  .qr-card canvas { border: 1px solid #e5e7eb; border-radius: 6px; padding: 8px; background: white; }
  .qr-card h3 { margin: 10px 0 2px; font-size: 15px; }
  .qr-card .role { font-size: 11px; color: #64748b; margin: 0 0 6px; }
  .qr-card .id { font-size: 10px; color: #94a3b8; letter-spacing: 0.05em; }
  .qr-card .site { font-size: 10px; color: #1F4E78; margin-top: 4px; font-weight: 600; }
  .qr-card.wfh .site { color: #6b21a8; }
  @media print { .no-print { display: none; } body { background: white; padding: 12px; } }
</style>
</head>
<body>
<div class="no-print">
  <h1>👥 Curio Attendance QR Sheet</h1>
  <p>Print, cut, and hand each QR to the respective employee. Each opens the check-in app pre-filled with their name.</p>
  <button onclick="window.print()">🖨️ Print</button>
</div>
<div class="grid" id="grid"></div>
<script>
const BASE = 'https://dashboard.curiolifestyle.com/Curio_Employee_Checkin.html';
const EMPLOYEES = [
  { id: 'E001', name: 'Tabish Habib',      role: 'CEO',                 wfh: true },
  { id: 'E002', name: 'Faraaz Mir',        role: 'Manager (Sales)',     wfh: true },
  { id: 'E003', name: 'Saif Khan',         role: 'Graphic Designer',    wfh: true },
  { id: 'E004', name: 'Jasmeen Kaur',      role: 'Factory Manager',     site: 'Factory (Jammu)' },
  { id: 'E005', name: 'Dheeraj Kumar',     role: 'Factory Staff (Data)', site: 'Factory (Jammu)' },
  { id: 'E006', name: 'Kamal Kishore',     role: 'Factory Staff',       site: 'Factory (Jammu)' },
  { id: 'E007', name: 'Yasir Iqbal',       role: 'Factory Staff',       site: 'Factory (Jammu)' },
  { id: 'E008', name: 'Maqbool Choudhary', role: 'Factory Staff',       site: 'Factory (Jammu)' },
  { id: 'E009', name: 'Mohammad Sahil',    role: 'Factory Staff',       site: 'Srinagar Office' },
  { id: 'E010', name: 'Neelam Devi',       role: 'Factory Staff',       site: 'Factory (Jammu)' },
  { id: 'E011', name: 'Rohni Devi',        role: 'Factory Staff',       site: 'Factory (Jammu)' },
  { id: 'E012', name: 'Shahnaz Bano',      role: 'Factory Staff',       site: 'Factory (Jammu)' },
  { id: 'E016', name: 'Mouzam Darwaish',   role: 'Supply Chain Manager', site: 'Srinagar Office' }
];
const grid = document.getElementById('grid');
EMPLOYEES.forEach(e => {
  const card = document.createElement('div');
  card.className = 'qr-card' + (e.wfh ? ' wfh' : '');
  const url = `${BASE}?emp=${e.id}`;
  card.innerHTML = `
    <canvas id="qr-${e.id}"></canvas>
    <h3>${e.name}</h3>
    <div class="role">${e.role}</div>
    <div class="id">${e.id}</div>
    <div class="site">${e.wfh ? '🏠 Work from home' : '📍 ' + e.site}</div>
  `;
  grid.appendChild(card);
  QRCode.toCanvas(document.getElementById(`qr-${e.id}`), url, { width: 180, margin: 1 }, err => { if (err) console.error(err); });
});
</script>
</body>
</html>
